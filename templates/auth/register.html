{% extends "layouts/base.html" %}

{% block title %}Register - StegaVault 3.0{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <div class="login-logo">
            <h1><i class="fas fa-user-plus"></i> {{ _('Create Account') }}</h1>
            <p>{{ _('Join StegaVault 3.0') }}</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Username -->
            <div class="form-group">
                <label for="username">{{ _('Username') }}</label>
                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    maxlength="100"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">{{ _('Email Address') }}</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    maxlength="120"
                    required
                >
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="registerPassword">{{ _('Password') }}</label>
                <div class="password-box">
                    <input
                        id="registerPassword"
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('registerPassword', this)"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- CONFIRM PASSWORD - YEH ADD KIYA -->
            <!-- ========================================== -->
            <div class="form-group">
                <label for="confirmPassword">{{ _('Confirm Password') }}</label>
                <div class="password-box">
                    <input
                        id="confirmPassword"
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button class="login-btn" type="submit">
                <i class="fa-solid fa-user-plus"></i>
                {{ _('Create Account') }}
            </button>

        </form>

        <div class="login-footer">
            <p>
                Already have an account?
                <a href="{{ url_for('auth.login') }}">{{ _('Login') }}</a>
            </p>
        </div>

    </div>

</div>

<script>
function togglePassword(inputId, button) {
    var input = document.getElementById(inputId);
    if (!input) return;
    var icon = button.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        if (icon) {
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    } else {
        input.type = 'password';
        if (icon) {
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
}
</script>

<style>
.login-container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    background: var(--bg);
}

.login-card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    box-shadow: var(--shadow);
}

.login-logo {
    text-align: center;
    margin-bottom: 35px;
}

.login-logo h1 {
    font-size: 34px;
    color: var(--text);
    margin-bottom: 10px;
}

.login-logo h1 i {
    color: var(--primary);
}

.login-logo p {
    color: var(--text-light);
    font-size: 15px;
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: var(--text-light);
    font-size: 14px;
    font-weight: 500;
}

.form-group input {
    width: 100%;
    height: 54px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bg);
    color: var(--text);
    padding: 0 16px;
    font-size: 15px;
    transition: 0.3s;
}

.form-group input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 55px;
}

.toggle-password {
    position: absolute;
    top: 50%;
    right: 15px;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: var(--text-light);
    font-size: 18px;
    cursor: pointer;
    padding: 5px;
}

.toggle-password:hover {
    color: var(--primary);
}

.login-btn {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    transition: 0.35s;
    cursor: pointer;
}

.login-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(37, 99, 235, 0.35);
}

.login-footer {
    margin-top: 30px;
    text-align: center;
    color: var(--text-light);
}

.login-footer a {
    color: var(--primary);
    font-weight: 600;
}

.login-footer a:hover {
    text-decoration: underline;
}
</style>

{% endblock %}
